line-length = 120

[lint]
select = ["ALL"]
# W191, D206 and COM812 conflict with the formatter (tab indent, trailing commas)
ignore = ["W191", "D206", "COM812"]
extend-safe-fixes = ["D205"]

[format]
indent-style = "tab"
#skip-magic-trailing-comma = true

[lint.pydocstyle]
convention = "pep257"

[lint.isort]
case-sensitive = true
force-single-line = true
# Two blank lines after the import block.
lines-after-imports = 2
